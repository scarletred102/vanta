name: Rust QEMU verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qemu:
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Resolve QEMU and OVMF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $firmwareName = 'edk2-x86_64-code.fd'
          $qemuCandidates = @(
            'C:\Program Files\qemu\qemu-system-x86_64.exe',
            'C:\Program Files\qemu\bin\qemu-system-x86_64.exe',
            'C:\ProgramData\chocolatey\lib\qemu\tools\qemu-system-x86_64.exe'
          )
          $qemuCommand = Get-Command qemu-system-x86_64.exe -CommandType Application -ErrorAction SilentlyContinue
          if ($qemuCommand) {
            $qemuCandidates += $qemuCommand.Path
          }
          $qemuCandidates = $qemuCandidates | Select-Object -Unique
          $qemu = $qemuCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $qemu) {
            throw "QEMU executable not found. Checked: $($qemuCandidates -join '; ')"
          }
          $qemu = (Resolve-Path -LiteralPath $qemu).Path
          if (-not (Test-Path -LiteralPath $qemu -PathType Leaf)) {
            throw "QEMU executable is not a file: $qemu"
          }

          $qemuDirectory = Split-Path -Parent $qemu
          $ovmfCandidates = @(
            "C:\Program Files\qemu\share\$firmwareName",
            "C:\Program Files\qemu\$firmwareName",
            "C:\ProgramData\chocolatey\lib\qemu\tools\share\$firmwareName",
            (Join-Path $qemuDirectory "share\$firmwareName"),
            (Join-Path (Split-Path -Parent $qemuDirectory) "share\$firmwareName")
          ) | Select-Object -Unique
          $ovmf = $ovmfCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $ovmf) {
            throw "OVMF firmware not found. Checked: $($ovmfCandidates -join '; ')"
          }
          $ovmf = (Resolve-Path -LiteralPath $ovmf).Path
          if (-not (Test-Path -LiteralPath $ovmf -PathType Leaf)) {
            throw "OVMF firmware is not a file: $ovmf"
          }

          "QEMU=$qemu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OVMF=$ovmf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "QEMU=$qemu"
          Write-Host "OVMF=$ovmf"
      - run: rustup toolchain install nightly-2026-07-10 --profile minimal
      - run: rustup default nightly-2026-07-10
      - run: rustup component add rust-src rustfmt --toolchain nightly-2026-07-10
      - run: rustup target add x86_64-unknown-none --toolchain nightly-2026-07-10
      - name: Format and build
        working-directory: rust/kernel
        run: |
          cargo fmt -- --check
          cargo build --release --locked
      - name: Host TCP framing tests
        working-directory: rust/kernel
        run: |
          rustc --edition=2021 --test .\src\net.rs -o $env:TEMP\vanta-net-tests.exe
          & $env:TEMP\vanta-net-tests.exe
      - name: QEMU regression matrix
        working-directory: rust
        run: |
          .\test-qemu.ps1
          .\test-qemu.ps1 -Virtio
          .\test-qemu.ps1 -Virtio -Network
