plan_id: 20260513-vanta-boot-hang
objective: Fix boot halt after GDT log in VantaOS
minimal_repro:
  steps:
    - Run ./scripts/build-iso.sh.
    - Run ./scripts/run-qemu.sh (serial stdio enabled).
    - Observe serial log progression.
  expected:
    - Serial shows checkpoints through GDT/IDT init and continues to PMM init.
  failing:
    - Serial stops immediately after the GDT log checkpoint.
timebox:
  per_wave_minutes: 45
  stop_conditions:
    - condition: No new serial checkpoint after two consecutive rebuild/run attempts (apply after wave-4 only).
      action: Halt further waves; capture serial log and diff of current changes.
    - condition: Triple fault/reset observed after IDT load or STI (apply after wave-4 only).
      action: Halt further waves; capture serial log and diff of current changes.
    - condition: "[TEST] IDT_VALID FAIL observed twice in a row" (apply after wave-4 only).
      action: Halt further waves; capture serial log and diff of current changes.
    - condition: "[TEST] INT3 FAIL observed twice in a row" (apply after wave-4 only).
      action: Halt further waves; capture serial log and diff of current changes.
    - condition: "[CHK] GDT_POST followed by GDT reload fault or reset within immediate next log."
      action: Halt further waves; capture serial log and diff of current changes.
risks:
  - risk: Triple fault due to invalid IDT gate selector or handler address.
    mitigation:
      - Validate selector/handler address range before enabling interrupts.
      - Keep STI gated behind a successful IDT delivery test.
  - risk: Unexpected IRQs while still masking or initializing PIC/APIC.
    mitigation:
      - Mask all interrupts before any STI and log controller state.
      - Defer STI until controller init/mask confirmed.
  - risk: GDT reload changes CS/DS/SS unexpectedly or leaves stale selectors in use.
    mitigation:
      - Log CS/DS/SS before and after reloadSegments and assert expected selectors.
      - Re-load segment registers in a single reload path and avoid partial updates.
  - risk: Invalid TSS/IST configuration causes #TS or double-fault during interrupt delivery.
    mitigation:
      - Validate TSS is loaded and IST entries are either valid or set to 0 in gate setup.
      - If TSS is not ready, force IST=0 for all gates until TSS is confirmed.
notes:
  - Focus on boot-sequence checkpoints and runtime validation of GDT/IDT state.
  - Rebuild + QEMU run after each change with serial checkpoints.
adaptive_guidance:
  - If the hang moves earlier/later after a wave, retarget the next wave to the new boundary (add checkpoints or validation around the new last-known-good log).
  - If the hang is resolved before wave-4, skip directly to wave-5 regression verification and capture a clean boot log.
waves:
  - name: wave-1-baseline-checkpoints
    goal: Add concrete boot checkpoints and runtime selector logging.
    success_criteria:
      - Serial shows checkpoints through GDT_PRE/GDT_POST/IDT_POST in order.
      - Selector logs show CS/DS/SS at each checkpoint without exceptions.
    tasks:
      - id: w1-t1-boot-checkpoints
        files:
          - kernel/main.zig
        steps:
          - Add serial checkpoints before/after GDT/IDT init and before any STI.
          - Emit a consistent checkpoint tag (e.g., [CHK] GDT_PRE/GDT_POST/IDT_POST).
          - Ensure checkpoints are log-only diagnostics (no behavior changes) or gated behind a debug flag.
        acceptance:
          - Serial log shows all new checkpoints in order up to the last known hang point.
      - id: w1-t2-runtime-cs-ds-ss-log
        files:
          - kernel/main.zig
          - kernel/arch/x86_64/gdt.zig
        steps:
          - Add helper to read CS/DS/SS via inline asm and log values.
          - Log selectors in kernel/main.zig checkpoints and inside gdt.reloadSegments.
          - If adding a guard for mismatched selectors, keep it debug-gated or log-only (no behavior changes in release).
          - Ensure selector logging is log-only diagnostics (no behavior changes) or gated behind a debug flag.
        acceptance:
          - Logs show current CS/DS/SS at each checkpoint.
          - CS value matches the intended selector at each stage.
          - Guard trips if CS/DS/SS are inconsistent after reloadSegments.
      - id: w1-t3-locate-sti-site
        files:
          - kernel/main.zig
          - kernel/arch/x86_64/idt.zig
        steps:
          - Locate the exact STI or interrupt-enable call site(s) in early boot (search targets: "sti", "enableInterrupts", "sti()", "interrupts.enable").
          - Log the call site sequence with a [CHK] STI_SITE tag to confirm STI is reached only after validation.
        acceptance:
          - STI location is identified and logged.
          - STI is only reachable after IDT validation gates.

  - name: wave-2-interrupt-controller
    goal: Ensure interrupt controller masking/init before any STI.
    success_criteria:
      - Interrupt controller masked/initialized before STI is reachable.
      - Serial shows controller state checkpoint.
    tasks:
      - id: w2-t1-mask-pic-or-apic
        files:
          - kernel/arch/x86_64/interrupts.zig # create if missing
          - kernel/main.zig
        steps:
          - Discover existing PIC/APIC init/mask code (search arch/x86_64 for PIC/APIC/LAPIC/IOAPIC/Limine usage).
          - Create kernel/arch/x86_64/interrupts.zig only if no suitable init/mask helper exists.
          - Add minimal PIC init/mask-all routine (or confirm Limine/APIC state) using the existing helper if found.
          - If no controller init/mask can be confirmed quickly, fall back to mask-all PIC routine or hard-stop before STI with a clear log marker.
          - Call masking/init before any STI usage.
          - Add serial checkpoint confirming controller state.
        acceptance:
          - Interrupt controller is initialized/masked before STI.
          - Log shows explicit PIC/APIC mask state.

  - name: wave-3-gdt-reload-validation
    goal: Verify GDT reload sets CS to intended selector and IDT uses correct code selector.
    success_criteria:
      - After reload, CS matches KERNEL_CODE_SEL.
      - IDT gate selector matches kernel CS selector.
      - No hang introduced between GDT and IDT checkpoints.
    tasks:
      - id: w3-t1-verify-reload-path
        files:
          - kernel/arch/x86_64/gdt.zig
        steps:
          - Audit reloadSegments far-return path for selector constants and correctness.
          - Align selector constants with exported GDT selectors in gdt.zig (e.g., gdt.KERNEL_CODE_SEL, gdt.KERNEL_DATA_SEL) and use them in reloadSegments.
        acceptance:
          - After reload, CS matches KERNEL_CODE_SEL.
          - No hang introduced between GDT and IDT checkpoints.
      - id: w3-t2-idt-selector-align
        files:
          - kernel/arch/x86_64/idt.zig
          - kernel/arch/x86_64/gdt.zig
        steps:
          - Update IDT gate selector to use gdt.KERNEL_CODE_SEL (no hardcoded 0x28).
          - Log the selector used in makeGate and confirm it matches gdt.KERNEL_CODE_SEL.
        acceptance:
          - IDT gate selector equals the active kernel CS selector.
          - No #GP/#TS exceptions after IDT load.

  - name: wave-4-idt-struct-validation
    goal: Validate IDTR base/limit, gate attributes, handler addresses, IST, and stack alignment.
    success_criteria:
      - IDTR base/limit match runtime idt table values.
      - Gates validate present/type/IST and handlers are in range.
      - Software interrupt delivery test succeeds without triple fault.
    tasks:
      - id: w4-t0-text-range-symbols
        files:
          - linker.ld
          - kernel/arch/x86_64/idt.zig
        steps:
          - Add __text_start/__text_end symbols in linker.ld to mark kernel text boundaries.
          - Add Zig externs for __text_start/__text_end and plumb them into IDT validation.
        acceptance:
          - Linker exports __text_start/__text_end and Zig can read their addresses.
      - id: w4-t1-idtr-dump
        files:
          - kernel/arch/x86_64/idt.zig
        steps:
          - Add helper to read IDTR via sidt and log base + limit.
          - Compare logged base/limit to &idt and size at runtime.
        acceptance:
          - Logged IDTR base equals &idt, limit equals sizeof(idt)-1.
      - id: w4-t2-gate-attr-validate
        files:
          - kernel/arch/x86_64/idt.zig
        steps:
          - Add runtime validation for each gate: present bit, type_attr = 0x8E, IST value.
          - Log first few gate descriptors (offset/selector/type_attr/ist).
          - Ensure validation logging and ISR logs are serial-safe (no locks/alloc, use serial.zig direct/unsafe write helper).
          - Emit result markers [TEST] IDT_VALID OK/FAIL.
        acceptance:
          - Validation reports all gates OK; no invalid attr/IST logged.
      - id: w4-t3-handler-address-range
        files:
          - kernel/arch/x86_64/idt.zig
          - kernel/main.zig
        steps:
          - Use __text_start/__text_end to validate handler address range.
          - Log handler addresses for vectors 0–31 and ensure they are within kernel text range.
          - Add a checkpoint if any handler is out of range.
        acceptance:
          - All handler addresses fall within the kernel image.
      - id: w4-t4-isr-stack-alignment
        files:
          - kernel/arch/x86_64/idt.zig
        steps:
          - Verify stack alignment in common_isr_handler before call handleException.
          - Adjust push/pop sequence if needed to ensure 16-byte alignment at call boundary.
        acceptance:
          - Alignment check passes; handleException runs without alignment faults.
      - id: w4-t5-interrupt-delivery-test
        files:
          - kernel/main.zig
          - kernel/arch/x86_64/idt.zig
        steps:
          - Add a software interrupt test (e.g., int3) after IDT load but before STI.
          - Only run the test if gate validation + handler-range checks + stack alignment check passed; otherwise log SKIP and keep STI disabled.
          - Log entry/exit from the handler using serial-safe logging (no locks/alloc).
          - Emit result markers [TEST] INT3 OK/FAIL.
          - Gate STI behind the successful test result.
          - If validation or INT3 fails, keep STI disabled and continue boot in a safe/limited mode: skip STI, proceed to PMM init, and log a clear marker indicating interrupts remain disabled.
        acceptance:
          - Handler log appears and returns without reboot/reset.
          - No triple fault observed when test runs.

  - name: wave-5-regression-verification
    goal: Rebuild/run checkpoints and confirm hang resolved.
    success_criteria:
      - Final run reaches post-IDT and PMM checkpoints without hang.
      - Serial logs show consistent selector/IDT validation outputs.
    tasks:
      - id: w5-t1-rebuild-qemu-per-change
        steps:
          - Run-only verification (no file edits in this wave).
          - After all prior wave changes, rebuild and run QEMU with serial logs captured.
          - Record checkpoint of last successful boot stage.
        acceptance:
          - Final run reaches post-IDT and PMM checkpoints without hang.
          - Serial logs show consistent selector/IDT validation outputs.
